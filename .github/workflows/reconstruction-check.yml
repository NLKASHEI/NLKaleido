name: Reconstruction checks
on:
  push:
    branches: ['feat/**', 'docs/**']
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Ensure shipped legacy bundle was not rewritten
        run: git diff --exit-code HEAD -- manifest.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: nlkaleido-st-author-studio-preview
          path: .preview-extension-build/
          if-no-files-found: error
